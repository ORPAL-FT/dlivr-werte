<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fleetback AfterSales — live</title>
<style>
  :root{--tx:#4a4a4a;--muted:#8a8a8a;--line:#e2e2e2;--head:#f4f4f4;--sum:#f7f7f7;--red:#e8443f;--blue:#3f7cba;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#e9e9e9;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px;
       font-family:"Segoe UI",Helvetica,Arial,sans-serif;color:var(--tx);}
  .card{width:1000px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 0 22px;}
  .ttl{text-align:center;color:#777;font-size:17px;font-weight:600;padding:16px;}
  .info{margin:0 18px 14px;border:1px solid var(--line);border-radius:3px;padding:10px 14px;font-size:14px;color:#555;}
  .info b{font-weight:600;color:#444;}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);margin:0 18px 16px;border:1px solid var(--line);border-radius:3px;overflow:hidden;}
  .tabs div{padding:11px 14px;font-size:14px;color:#777;border-right:1px solid var(--line);background:#fafafa;}
  .tabs div:last-child{border-right:0;}
  .tabs div.on{color:#333;background:#fff;font-weight:600;box-shadow:inset 0 -3px 0 var(--blue);}
  table{width:calc(100% - 36px);margin:0 18px;border-collapse:collapse;font-size:14px;}
  th,td{border:1px solid var(--line);padding:11px 10px;text-align:right;white-space:nowrap;}
  td:not(.rlbl):not(.group){font-variant-numeric:tabular-nums;}
  thead th{background:#fff;color:#888;font-weight:600;text-align:center;}
  thead th.sumh{background:var(--sum);}
  .group{background:var(--head);color:#666;font-weight:600;text-align:left;vertical-align:middle;}
  .rlbl{background:var(--head);color:#666;font-weight:400;text-align:left;}
  .sum{background:var(--sum);color:#555;}
  td.red{background:var(--red);color:#fff;font-weight:600;}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:22px 18px 0;}
  .kpi{border:1px solid var(--line);border-radius:3px;padding:16px 18px;}
  .kpi .loc{font-size:26px;color:#555;margin-bottom:6px;}
  .kpi .big{font-size:34px;color:#444;display:flex;align-items:center;gap:8px;}
  .kpi .arr{color:var(--red);font-size:22px;}
  .kpi .sub{color:var(--red);font-size:15px;margin-top:6px;}
  .status{color:#666;font-size:13px;margin-top:12px;}
  .status.err{color:#b00;}
</style>
</head>
<body>
  <div class="card">
    <div class="ttl">Fleetback AfterSales-Auswertung</div>
    <div class="info" id="info">…</div>
    <table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
    <div class="cards" id="cards"></div>
  </div>
  <div class="status" id="status">verbinde…</div>

<script>
  const BASE="https://uauciazqeshepefuvomd.supabase.co/rest/v1/rpc/get_fleetback_trmnl";
  const ANON="sb_publishable_iUP2BIQKC-Q7Y38Fw4uQsQ_GEab-nHH";
  const mandant=(new URLSearchParams(location.search)).get("mandant")||"Autohaus Mustermann, Mainz";
  const metrics=[
    {key:"vorgaenge",label:"Vorgänge"},
    {key:"versendet",label:"CheckIn versendet"},
    {key:"abgeschlossen",label:"CheckIn abgeschlossen"},
    {key:"ziel",label:"Vereinbartes Ziel"},
    {key:"abw",label:"Abweichung Ziel",red:true},
  ];
  const el=id=>document.getElementById(id);
  const td=(cls,txt)=>{const d=document.createElement("td");if(cls)d.className=cls;d.textContent=txt??"";return d;};

  function render(d){
    el("info").innerHTML=`Vorgänge von: <b>${d.date_from||""}</b> bis: <b>${d.date_to||""}</b> &nbsp;&nbsp; Händler: <b>${d.haendler||""}</b>`;
    const cols=d.columns||[]; const last=cols.length-1;
    const thead=el("thead"); thead.innerHTML="";
    const hr=document.createElement("tr"); hr.appendChild(td("")); hr.appendChild(td(""));
    cols.forEach((c,i)=>{const th=document.createElement("th"); if(i===last)th.className="sumh"; th.textContent=c.name; hr.appendChild(th);});
    thead.appendChild(hr);
    const tb=el("tbody"); tb.innerHTML="";
    metrics.forEach((m,mi)=>{
      const tr=document.createElement("tr");
      if(mi===0){const g=td("group",""); g.rowSpan=metrics.length; g.textContent="Gesamtsumme"; g.style.verticalAlign="middle"; tr.appendChild(g);}
      tr.appendChild(td("rlbl",m.label));
      cols.forEach((c,ci)=>{
        const isLast=ci===last;
        const cls=isLast?"sum":(m.red?"red":"");
        tr.appendChild(td(cls,c[m.key]));
      });
      tb.appendChild(tr);
    });
    const cw=el("cards"); cw.innerHTML="";
    cols.filter(c=>c.card_value!=null).forEach(c=>{
      const div=document.createElement("div"); div.className="kpi";
      div.innerHTML=`<div class="loc"></div><div class="big"><span class="v"></span> <span class="arr">▼</span></div><div class="sub"></div>`;
      div.querySelector(".loc").textContent=c.name;
      div.querySelector(".v").textContent=c.card_value;
      div.querySelector(".sub").textContent=`${c.card_delta} / ${c.card_pct}`;
      cw.appendChild(div);
    });
  }
  async function tick(){
    const st=el("status");
    try{
      const r=await fetch(`${BASE}?p_mandant=${encodeURIComponent(mandant)}`,{headers:{apikey:ANON,authorization:"Bearer "+ANON}});
      if(!r.ok) throw new Error("HTTP "+r.status);
      const d=await r.json();
      if(!d||!d.columns){st.textContent="Mandant nicht gefunden: "+mandant;st.className="status err";return;}
      render(d); st.textContent="live · Aktualisierung alle 30 s · zuletzt "+new Date().toLocaleTimeString("de-DE"); st.className="status";
    }catch(e){st.textContent="getrennt: "+(e.message||e); st.className="status err";}
  }
  tick(); setInterval(tick,30000);
</script>
</body>
</html>
