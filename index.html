<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dealer.Insights — Werte erfassen</title>
<style>
  :root{--tx:#1a1a1a;--muted:#777;--line:#e2e2e2;--bg:#f4f5f7;--accent:#111;--ok:#177245;--err:#c0392b;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--tx);font-family:"Helvetica Neue",Arial,sans-serif;padding:20px;line-height:1.4;}
  .wrap{max-width:820px;margin:0 auto;}
  h1{font-size:24px;font-weight:800;}
  .sub{color:var(--muted);font-size:14px;margin:2px 0 18px;}
  .bar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;
       flex-wrap:wrap;gap:16px;align-items:end;margin-bottom:20px;}
  .fld{display:flex;flex-direction:column;gap:4px;}
  .fld label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  input,select{border:1px solid #c9ccd1;border-radius:8px;padding:9px 11px;font-size:15px;font-family:inherit;background:#fff;}
  input:focus,select:focus{outline:2px solid #3f7cba;border-color:#3f7cba;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px;}
  .card h2{font-size:20px;font-weight:800;margin-bottom:2px;}
  .card .m{font-size:13px;color:var(--muted);margin-bottom:14px;}
  .metrow{display:flex;gap:12px;flex-wrap:wrap;align-items:end;}
  .metrow .fld{flex:1;min-width:160px;}
  table{width:100%;border-collapse:collapse;margin-top:6px;}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:15px;}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;}
  td .v{width:150px;text-align:right;}
  button{border:0;border-radius:8px;padding:9px 14px;font-size:14px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer;}
  button:active{transform:scale(.98);}
  button.sec{background:#e9ebef;color:#333;}
  button.del{background:#f7e2e2;color:#a3281f;padding:7px 10px;}
  .addrow{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
  .msg{font-size:13px;font-weight:700;margin-left:8px;}
  .msg.ok{color:var(--ok);} .msg.err{color:var(--err);}
  .status{font-size:13px;color:var(--muted);}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Dealer.Insights — Werte erfassen</h1>
  <div class="sub" id="mandantLine">Autohaus Mustermann, Mainz</div>

  <div class="bar">
    <div class="fld">
      <label for="pin">Bearbeitungs-PIN</label>
      <input id="pin" type="password" placeholder="PIN" style="width:130px" />
    </div>
    <div class="fld" style="flex:1;min-width:220px;">
      <label for="kpi">Kennzahl</label>
      <select id="kpi"></select>
    </div>
    <div class="status" id="topstatus"></div>
  </div>

  <div id="detail"></div>
</div>

<script>
  const URL="https://uauciazqeshepefuvomd.supabase.co/rest/v1/rpc";
  const ANON="sb_publishable_iUP2BIQKC-Q7Y38Fw4uQsQ_GEab-nHH";
  const MANDANT="Autohaus Mustermann, Mainz";
  const HDR={apikey:ANON,authorization:"Bearer "+ANON,"Content-Type":"application/json"};
  const $=id=>document.getElementById(id);
  const SEITEN={1:"Effizienz",2:"Umsatz & DB",3:"Fokusprodukte",4:"Kundenstimme",5:"Google"};
  let CURDEC=0;

  $("pin").value=localStorage.getItem("dealer_form_pin")||"";
  $("pin").addEventListener("change",()=>localStorage.setItem("dealer_form_pin",$("pin").value));

  function deParse(str){ if(str==null)return null; const s=String(str).trim().replace(/\./g,"").replace(",","."); if(s==="")return null; const n=Number(s); return Number.isFinite(n)?n:NaN; }
  function deFmt(v,dec){ return Number(v).toLocaleString("de-DE",{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
  function pin(){ return $("pin").value.trim(); }

  async function rpc(fn,body){
    const r=await fetch(URL+"/"+fn,{method:"POST",headers:HDR,body:JSON.stringify(body)});
    const t=await r.text(); let d=null; try{d=JSON.parse(t)}catch(e){}
    if(!r.ok) throw new Error((d&&d.message)||("HTTP "+r.status));
    return d;
  }

  async function init(){
    $("topstatus").textContent="lädt…";
    try{
      const list=await rpc("form_dealer_list",{p_mandant:MANDANT});
      const sel=$("kpi"); sel.innerHTML="";
      const bySeite={}; list.forEach(k=>{(bySeite[k.seite]=bySeite[k.seite]||[]).push(k)});
      Object.keys(bySeite).sort().forEach(s=>{
        const og=document.createElement("optgroup"); og.label="Seite "+s+" · "+(SEITEN[s]||"");
        bySeite[s].forEach(k=>{const o=document.createElement("option");o.value=k.kpi_key;o.textContent=k.label;og.appendChild(o)});
        sel.appendChild(og);
      });
      $("topstatus").textContent="";
      sel.addEventListener("change",loadKpi);
      if(list.length) loadKpi();
    }catch(e){ $("topstatus").textContent="Fehler: "+e.message; }
  }

  async function loadKpi(){
    const key=$("kpi").value; const d=$("detail"); d.innerHTML="lädt…";
    try{
      const k=await rpc("form_dealer_months",{p_mandant:MANDANT,p_kpi_key:key});
      CURDEC=k.decimals;
      render(k);
    }catch(e){ d.innerHTML=""; d.textContent="Fehler: "+e.message; }
  }

  function render(k){
    const now=new Date(); const curMonth=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
    const rows=(k.months||[]).map(m=>`
      <tr data-p="${m.periode}">
        <td>${m.periode}</td>
        <td><input class="v" inputmode="decimal" value="${deFmt(m.value,k.decimals)}" /> ${k.unit||""}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="save">Speichern</button>
          <button class="del">✕</button>
          <span class="msg"></span>
        </td>
      </tr>`).join("");
    $("detail").innerHTML=`
      <div class="card">
        <h2>${k.label}</h2>
        <div class="m">${k.unit?("Einheit "+k.unit+" · "):""}${(k.months||[]).length} Monate erfasst</div>
        <div class="metrow">
          <div class="fld" style="flex:1"><label>Ziel-Zeile (klein, oben)</label><input id="mTarget" value="${k.target||""}" /></div>
          <div class="fld" style="flex:2"><label>Zusatzzeile (mit „ · " trennen → wird untereinander angezeigt)</label><input id="mSub" value="${k.sub||""}" /></div>
          <button class="sec" id="saveMeta">Text speichern</button><span class="msg" id="metaMsg"></span>
        </div>
        <div class="hint">Der Wert des jüngsten Monats ist automatisch der „aktuelle Wert" auf dem Display.</div>

        <table>
          <thead><tr><th>Monat</th><th>Wert</th><th></th></tr></thead>
          <tbody id="tbody">${rows||'<tr><td colspan="3" style="color:#999">noch keine Monatswerte</td></tr>'}</tbody>
        </table>

        <div class="addrow">
          <div class="fld"><label>Monat hinzufügen</label><input type="month" id="newMonth" value="${curMonth}" /></div>
          <div class="fld"><label>Wert</label><input id="newVal" class="v" inputmode="decimal" style="width:150px" /></div>
          <button id="addBtn">Hinzufügen</button><span class="msg" id="addMsg"></span>
        </div>
      </div>`;

    const key=$("kpi").value;
    $("saveMeta").onclick=async e=>{
      const msg=$("metaMsg"); if(!pin()){msg.className="msg err";msg.textContent="PIN?";return;}
      try{ await rpc("form_dealer_set_meta",{p_pin:pin(),p_mandant:MANDANT,p_kpi_key:key,p_target:$("mTarget").value,p_sub:$("mSub").value});
        msg.className="msg ok";msg.textContent="✓";}catch(err){msg.className="msg err";msg.textContent=err.message;}
    };
    $("tbody").querySelectorAll("tr[data-p]").forEach(tr=>{
      const per=tr.getAttribute("data-p");
      tr.querySelector(".save").onclick=()=>saveMonth(key,per+"-01",tr.querySelector(".v").value,tr.querySelector(".msg"));
      tr.querySelector(".del").onclick=()=>delMonth(key,per+"-01",tr.querySelector(".msg"));
    });
    $("addBtn").onclick=()=>{
      const per=$("newMonth").value; if(!per){$("addMsg").className="msg err";$("addMsg").textContent="Monat?";return;}
      saveMonth(key,per+"-01",$("newVal").value,$("addMsg"),true);
    };
  }

  async function saveMonth(key,periode,valStr,msg,reload){
    msg.className="msg"; msg.textContent="";
    if(!pin()){msg.className="msg err";msg.textContent="PIN?";return;}
    const v=deParse(valStr); if(v==null||Number.isNaN(v)){msg.className="msg err";msg.textContent="Wert?";return;}
    try{ await rpc("form_dealer_set_month",{p_pin:pin(),p_mandant:MANDANT,p_kpi_key:key,p_periode:periode,p_value:v});
      msg.className="msg ok"; msg.textContent="✓ gespeichert"; if(reload) loadKpi();
    }catch(e){ msg.className="msg err"; msg.textContent=e.message; }
  }
  async function delMonth(key,periode,msg){
    if(!pin()){msg.className="msg err";msg.textContent="PIN?";return;}
    if(!confirm("Diesen Monatswert löschen?")) return;
    try{ await rpc("form_dealer_del_month",{p_pin:pin(),p_mandant:MANDANT,p_kpi_key:key,p_periode:periode}); loadKpi(); }
    catch(e){ msg.className="msg err"; msg.textContent=e.message; }
  }

  init();
</script>
</body>
</html>
