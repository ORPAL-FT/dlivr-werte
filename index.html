<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dealer.Insights — Werte erfassen</title>
<style>
  :root{--tx:#1a1a1a;--muted:#777;--line:#e2e2e2;--bg:#f4f5f7;--accent:#111;--ok:#177245;--err:#c0392b;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--tx);font-family:"Helvetica Neue",Arial,sans-serif;padding:20px;line-height:1.4;}
  .wrap{max-width:900px;margin:0 auto;}
  h1{font-size:24px;font-weight:800;letter-spacing:.01em;}
  .sub{color:var(--muted);font-size:14px;margin:2px 0 18px;}
  .bar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;
       flex-wrap:wrap;gap:16px;align-items:end;margin-bottom:20px;position:sticky;top:10px;z-index:5;}
  .fld{display:flex;flex-direction:column;gap:4px;}
  .fld label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  input,select{border:1px solid #c9ccd1;border-radius:8px;padding:9px 11px;font-size:15px;font-family:inherit;background:#fff;}
  input:focus,select:focus{outline:2px solid #3f7cba;outline-offset:0;border-color:#3f7cba;}
  .seite{margin-bottom:22px;}
  .seite h2{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 2px 8px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;}
  .kpi .name{font-size:16px;font-weight:800;}
  .kpi .meta{font-size:12px;color:var(--muted);margin:1px 0 12px;}
  .row{display:flex;gap:10px;align-items:end;flex-wrap:wrap;}
  .row .fld{flex:1;min-width:120px;}
  .valwrap{display:flex;align-items:center;gap:6px;}
  .valwrap .unit{font-weight:800;color:var(--muted);}
  .full{width:100%;}
  button{border:0;border-radius:8px;padding:10px 16px;font-size:15px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer;}
  button:active{transform:scale(.98);}
  button.sec{background:#e9ebef;color:#333;}
  .msg{font-size:13px;font-weight:700;margin-top:8px;min-height:16px;}
  .msg.ok{color:var(--ok);} .msg.err{color:var(--err);}
  .status{font-size:13px;color:var(--muted);margin-top:6px;}
  @media(max-width:640px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Dealer.Insights — Werte erfassen</h1>
  <div class="sub" id="mandantLine">Autohaus Mustermann, Mainz</div>

  <div class="bar">
    <div class="fld">
      <label for="pin">Bearbeitungs-PIN</label>
      <input id="pin" type="password" placeholder="PIN" style="width:130px" />
    </div>
    <div class="fld">
      <label for="monat">Monat (Verlauf)</label>
      <input id="monat" type="month" />
    </div>
    <button class="sec" id="reload">Neu laden</button>
    <div class="status" id="topstatus"></div>
  </div>

  <div id="content"></div>
</div>

<script>
  const URL="https://uauciazqeshepefuvomd.supabase.co/rest/v1/rpc";
  const ANON="sb_publishable_iUP2BIQKC-Q7Y38Fw4uQsQ_GEab-nHH";
  const MANDANT="Autohaus Mustermann, Mainz";
  const HDR={apikey:ANON,authorization:"Bearer "+ANON,"Content-Type":"application/json"};
  const $=id=>document.getElementById(id);
  const SEITEN={1:"Effizienz",2:"Umsatz & DB",3:"Fokusprodukte",4:"Kundenstimme",5:"Google"};

  // PIN merken (lokal, nicht im Quelltext)
  $("pin").value=localStorage.getItem("dealer_form_pin")||"";
  $("pin").addEventListener("change",()=>localStorage.setItem("dealer_form_pin",$("pin").value));
  // Monat default = aktueller Monat
  const now=new Date(); $("monat").value=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");

  function deParse(str){ // "148.300" / "98,4" -> Zahl
    if(str==null) return null;
    const s=String(str).trim().replace(/\./g,"").replace(",",".");
    if(s==="") return null;
    const n=Number(s); return Number.isFinite(n)?n:NaN;
  }
  function deFmt(v,dec){ return Number(v).toLocaleString("de-DE",{minimumFractionDigits:dec,maximumFractionDigits:dec}); }

  async function rpc(fn,body){
    const r=await fetch(URL+"/"+fn,{method:"POST",headers:HDR,body:JSON.stringify(body)});
    const t=await r.text(); let d=null; try{d=JSON.parse(t)}catch(e){}
    if(!r.ok) throw new Error((d&&d.message)||("HTTP "+r.status));
    return d;
  }

  async function load(){
    $("topstatus").textContent="lädt…";
    try{
      const kpis=await rpc("form_dealer_list",{p_mandant:MANDANT});
      render(kpis); $("topstatus").textContent=kpis.length+" Kennzahlen geladen";
    }catch(e){ $("topstatus").textContent="Fehler: "+e.message; }
  }

  function render(kpis){
    const byS={}; kpis.forEach(k=>{(byS[k.seite]=byS[k.seite]||[]).push(k)});
    const c=$("content"); c.innerHTML="";
    Object.keys(byS).sort().forEach(s=>{
      const sec=document.createElement("div"); sec.className="seite";
      sec.innerHTML=`<h2>Seite ${s} · ${SEITEN[s]||""}</h2><div class="grid"></div>`;
      const grid=sec.querySelector(".grid");
      byS[s].forEach(k=>grid.appendChild(card(k)));
      c.appendChild(sec);
    });
  }

  function card(k){
    const el=document.createElement("div"); el.className="kpi";
    el.innerHTML=`
      <div class="name">${k.label}</div>
      <div class="meta">${k.unit?("Einheit "+k.unit+" · "):""}letzter Monat: ${k.last_periode||"—"}</div>
      <div class="row">
        <div class="fld" style="flex:0 0 150px">
          <label>Wert</label>
          <div class="valwrap"><input class="v" value="${deFmt(k.value,k.decimals)}" inputmode="decimal" style="width:110px" /><span class="unit">${k.unit||""}</span></div>
        </div>
        <div class="fld" style="flex:1"><label>Ziel (optional)</label><input class="t" value="${k.target||""}" /></div>
      </div>
      <div class="fld full" style="margin-top:10px"><label>Zusatzzeile (z. B. Lohn/Teile/Fremd)</label><input class="s" value="${k.sub||""}" /></div>
      <div style="margin-top:12px"><button data-key="${k.kpi_key}" data-dec="${k.decimals}">Speichern</button><span class="msg"></span></div>`;
    el.querySelector("button").addEventListener("click",ev=>save(ev.target,el,k.kpi_key));
    return el;
  }

  async function save(btn,el,key){
    const msg=el.querySelector(".msg"); msg.className="msg"; msg.textContent="";
    const pin=$("pin").value.trim();
    if(!pin){ msg.className="msg err"; msg.textContent="Bitte PIN eingeben"; return; }
    const val=deParse(el.querySelector(".v").value);
    if(val==null||Number.isNaN(val)){ msg.className="msg err"; msg.textContent="Wert ungültig"; return; }
    const periode=$("monat").value+"-01";
    btn.disabled=true; msg.textContent="speichert…";
    try{
      await rpc("form_dealer_save",{p_pin:pin,p_mandant:MANDANT,p_kpi_key:key,
        p_value:val,p_periode:periode,p_target:el.querySelector(".t").value,p_sub:el.querySelector(".s").value});
      msg.className="msg ok"; msg.textContent="✓ gespeichert (Display folgt in ≤15 Min)";
    }catch(e){ msg.className="msg err"; msg.textContent="Fehler: "+e.message; }
    finally{ btn.disabled=false; }
  }

  $("reload").addEventListener("click",load);
  load();
</script>
</body>
</html>
